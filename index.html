<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rep Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rep Quest">
<meta name="theme-color" content="#10121c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#10121c;--panel:#1a1d2b;--panel-2:#232738;--line:#2f3449;
  --fg:#eef0f7;--muted:#9097b0;--gold:#f2b33d;--gold-deep:#b9821c;--flame:#ff6b57;--done:#4fd1b5;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.lv{display:flex;flex-direction:column;gap:6px;min-width:0}
.lv-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.lv-row b{font-family:var(--display);font-size:18px;color:var(--fg);letter-spacing:.04em;text-transform:uppercase}
.bar{height:10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .6s}
.streak{display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:12px;background:rgba(255,107,87,.1);border:1px solid rgba(255,107,87,.35)}
.streak b{font-family:var(--display);font-size:28px;line-height:1;color:var(--flame)}
.streak span{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:600;white-space:nowrap}

/* day header */
.day{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:4px}
.day small{display:block;font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:700;text-transform:uppercase}
.day h1{margin:2px 0 0;font-family:var(--display);font-size:40px;font-weight:800;line-height:1;text-transform:uppercase}
.day .count{font-family:var(--display);font-size:30px;font-weight:800;color:var(--gold);line-height:1}

/* cards + rows */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 4px;gap:10px}
.card-h h2{margin:0;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.card-h span{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);padding:2px 0 8px}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 0;text-align:left}
.row:first-of-type{border-top:0}
.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.row.on .box{background:var(--done);border-color:var(--done)}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted);margin-top:1px}
.row .r{font-family:var(--display);font-size:18px;font-weight:700;color:var(--gold);white-space:nowrap;text-align:right}
.row.on .t{color:var(--muted);text-decoration:line-through}
.row.on .r{color:var(--done)}
.done-banner{background:rgba(79,209,181,.12);border:1px solid rgba(79,209,181,.45);color:var(--done);border-radius:14px;padding:14px;font-weight:600;text-align:center}

/* small stuff */
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:13px;font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;text-decoration:none;display:block;width:100%}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
details h4{margin:12px 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
details ul,details ol{margin:0;padding-left:18px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.foot{font-size:12px;color:var(--muted);text-align:center}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s ease-out both}
.toast b{color:var(--gold);font-family:var(--display);font-size:18px}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="lv">
      <div class="lv-row"><b id="lvName">Level 1</b><span id="xpText">0 / 100 XP</span></div>
      <div class="bar"><i id="xpBar"></i></div>
    </div>
    <div class="streak"><b id="streak" class="num">0</b><span>Day streak</span></div>
  </div>

  <div class="day">
    <div><small id="dateLine"></small><h1 id="dayTitle"></h1></div>
    <div class="count" id="count">0/0</div>
  </div>

  <div id="banner"></div>

  <div class="card" id="workout"></div>
  <div class="card" id="food"></div>
  <div class="card" id="habits"></div>

  <div class="card" id="remind" hidden style="padding:14px;display:flex;flex-direction:column;gap:10px">
    <div style="font-weight:600">Turn on daily reminders</div>
    <div class="note" style="padding:0">Adds alerts to your iPhone Calendar: breakfast 6:15 AM, lunch noon, workout 6:00 PM, dinner 7:30 PM, shake 8:30 PM, Sunday meal prep.</div>
    <a class="btn" href="reminders.ics">Add reminders to Calendar</a>
    <button type="button" class="btn ghost" id="remindDone">Done, I added them</button>
  </div>

  <details>
    <summary>Sunday meal prep recipes</summary>
    <div id="recipes"></div>
  </details>

  <div class="two">
    <button type="button" class="btn ghost" id="exportBtn" style="font-size:15px">Export backup</button>
    <label class="btn ghost" for="importFile" style="font-size:15px;cursor:pointer">Import backup</label>
    <input type="file" id="importFile" class="sr" accept="application/json,.json">
  </div>
  <p class="foot">Saved only on this phone. <span id="backupNote"></span> · <button type="button" id="muteBtn">Sounds on</button> · <button type="button" id="reRemind">Reminder setup</button></p>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
/* ---------- the plan: calisthenics every day ---------- */
const PUSH={name:'Push day',ex:[
  ['Incline push-ups','Hands on a counter or bench, body straight','3 × 8–12'],
  ['Pike push-ups','Hips high, lower your head toward the floor','3 × 6–10'],
  ['Chair dips','Hands on a sturdy chair, feet on the floor','3 × 8–12'],
  ['Plank','Straight line, squeeze your glutes','3 × 30 s']]};
const LEGS={name:'Leg day',ex:[
  ['Bodyweight squats','Sit back, chest up','3 × 15'],
  ['Reverse lunges','Step back, back knee almost to the floor','3 × 10 each leg'],
  ['Glute bridges','Squeeze hard at the top','3 × 15'],
  ['Wall sit','Thighs level with the floor','3 × 30 s']]};
const PULL={name:'Pull day',ex:[
  ['Inverted rows','Under a sturdy table or low bar, pull chest up','3 × 6–10'],
  ['Towel door rows','Towel around a door handle, lean back, pull in','3 × 10'],
  ['Superman holds','Lift arms and legs, hold 2 seconds','3 × 12'],
  ['Dead bugs','Low back pressed to the floor','3 × 10 each side']]};
const CORE={name:'Core + stretch',ex:[
  ['Plank','Straight line, breathe','3 × 30 s'],
  ['Side plank','Hips up','3 × 20 s each side'],
  ['Hollow hold','Low back on the floor, arms overhead','3 × 15 s'],
  ['Stretch','Hips, hamstrings, chest, shoulders','10 min']]};
const WEEK={1:PUSH,2:LEGS,3:PULL,4:CORE,5:PUSH,6:LEGS,0:PULL};

const BRK={name:'5 scrambled eggs',p:31},SHAKE={name:'Protein shake, 2 scoops',p:50};
const DISH={chk:{name:'Lemon-pepper chicken & broccoli',p:52},chili:{name:'Turkey chili',p:46},steak:{name:'Garlic steak bites & green beans',p:54},salmon:{name:'Baked salmon & asparagus',p:44}};
const MEALS={1:['salmon','steak'],2:['chk','salmon'],3:['salmon','chili'],4:['chk','steak'],5:['chili','chk'],6:['steak','chili'],0:['chk','chili']};
const RECIPES=[
  ['Lemon-pepper chicken & broccoli (4 portions)',['3½ lb boneless skinless chicken thighs','2 lb broccoli','Olive oil, salt-free lemon pepper, garlic powder'],['Oven 425°F. Toss chicken with oil and seasoning, roast 10 min.','Add broccoli, roast 15 more min.','Split into 4 containers.']],
  ['Turkey chili (4 portions)',['3 lb 93% lean ground turkey','1 onion, 2 bell peppers','1 can no-salt-added diced tomatoes, 1 can kidney beans','1 cup low-sodium broth, chili powder, cumin'],['Brown the turkey, about 8 min.','Add everything else, simmer 30 min.','Split into 4 containers.']],
  ['Garlic steak bites & green beans (3 portions)',['2½ lb sirloin, cubed','2 tbsp butter, garlic','3 steam-bag green beans'],['Sear steak in a hot pan in 2 batches, 3–4 min each.','Add butter and garlic, toss.','Microwave beans, split into 3 containers.']],
  ['Baked salmon & asparagus (3 portions)',['3 salmon fillets','2 bunches asparagus','Olive oil, lemon, dill'],['Oven 400°F, everything on one pan.','Bake 12–15 min.','Eat these Mon–Wed.']]];
const HABITS=[['water','Drink 3 L of water'],['noscroll','No Reels, Shorts or TikTok']];
const CHECK_XP=10, DAY_XP=50;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const dowOf=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const TICK='<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- state (stored only on this phone) ---------- */
const KEY='repquest.simple.v1';
let st={checks:{},bonus:[],created:dkey(Date.now()),reminders:false,mute:false,lastBackup:0};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.checks)st=Object.assign(st,v)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
save();

function itemsFor(k){
  const dow=dowOf(k),w=WEEK[dow],[l,d]=MEALS[dow];
  const workout=w.ex.map((e,i)=>({id:'w'+i,t:e[0],s:e[1],r:e[2]}));
  const food=[{id:'brk',t:'Breakfast · '+BRK.name,s:'6:15 AM',r:BRK.p+' g'},{id:'lunch',t:'Lunch · '+DISH[l].name,s:'12:00 PM',r:DISH[l].p+' g'},
    {id:'dinner',t:'Dinner · '+DISH[d].name,s:'7:30 PM',r:DISH[d].p+' g'},{id:'shake',t:'Shake · '+SHAKE.name,s:'8:30 PM',r:SHAKE.p+' g'}];
  if(dow===0)food.push({id:'prep',t:'Meal prep for the week',s:'1:00 PM · recipes at the bottom',r:'90 min'});
  const habits=HABITS.map(h=>({id:h[0],t:h[1],s:'',r:''}));
  return{name:w.name,workout,food,habits,all:[...workout,...food,...habits]};
}
const isDone=k=>{const c=st.checks[k]||[];return itemsFor(k).all.every(i=>c.includes(i.id))};

function stats(){
  let xp=0;for(const k in st.checks){xp+=(st.checks[k]||[]).length*CHECK_XP;if(isDone(k))xp+=DAY_XP}
  for(const b of st.bonus)xp+=b.xp;
  let lv=1,into=xp;const need=n=>100+50*(n-1);while(into>=need(lv)){into-=need(lv);lv++}
  // streak: a single missed day is forgiven, two in a row resets it
  const today=dkey(Date.now());let streak=0,prevMiss=false;
  for(let d=st.created,n=0;d<=today&&n<4000;d=addDays(d,1),n++){
    if(isDone(d)){streak++;prevMiss=false}else if(d<today){if(prevMiss)streak=0;prevMiss=true}}
  return{xp,lv,into,need:need(lv),streak};
}
const TITLES=[[1,'Rookie'],[3,'Trainee'],[5,'Contender'],[8,'Athlete'],[12,'Veteran'],[16,'Champion'],[20,'Legend']];
const title=n=>{let t='Rookie';for(const [l,x] of TITLES)if(n>=l)t=x;return t};

/* ---------- render ---------- */
let shownDay=dkey(Date.now());
function rows(list,checked){return list.map(i=>{const on=checked.includes(i.id);
  return`<button type="button" class="row${on?' on':''}" data-id="${i.id}" aria-pressed="${on}"><div class="box" aria-hidden="true">${on?TICK:''}</div><div style="min-width:0"><div class="t">${i.t}</div>${i.s?`<div class="s">${i.s}</div>`:''}</div><div class="r">${i.r}</div></button>`}).join('')}
function render(){
  const k=dkey(Date.now());shownDay=k;const it=itemsFor(k);const c=st.checks[k]||[];const s=stats();
  $('lvName').textContent=`Level ${s.lv} · ${title(s.lv)}`;$('xpText').textContent=`${s.into} / ${s.need} XP`;$('xpBar').style.width=(s.into/s.need*100)+'%';
  $('streak').textContent=s.streak;
  $('dateLine').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  $('dayTitle').textContent=it.name;
  const done=it.all.filter(i=>c.includes(i.id)).length;$('count').textContent=`${done}/${it.all.length}`;
  $('banner').innerHTML=done===it.all.length?`<div class="done-banner">Day complete. +${DAY_XP} XP. See you tomorrow.</div>`:'';
  const wDone=it.workout.filter(i=>c.includes(i.id)).length;
  $('workout').innerHTML=`<div class="card-h"><h2>Workout · ${it.name}</h2><span>${wDone}/${it.workout.length} · 6:00 PM</span></div>
    <div class="note">Warm up 3 min: arm circles, leg swings, 10 squats. Rest about 60 s between sets. When every set hits the top number, make it harder next time.</div>${rows(it.workout,c)}`;
  $('food').innerHTML=`<div class="card-h"><h2>Food</h2><span>protein</span></div>${rows(it.food,c)}`;
  $('habits').innerHTML=`<div class="card-h"><h2>Habits</h2><span></span></div>${rows(it.habits,c)}`;
  $('remind').hidden=!!st.reminders;
  $('muteBtn').textContent=st.mute?'Sounds off':'Sounds on';
  const d=st.lastBackup?Math.floor((Date.now()-st.lastBackup)/864e5):null;
  $('backupNote').textContent=d===null?'No backup yet':d<1?'Backed up today':`Last backup ${d} day${d>1?'s':''} ago`;
  $('backupNote').style.color=(d===null&&Object.keys(st.checks).length>3)||d>7?'var(--flame)':'';
}
$('recipes').innerHTML=RECIPES.map(r=>`<h4>${r[0]}</h4><ul>${r[1].map(x=>`<li>${x}</li>`).join('')}</ul><ol>${r[2].map(x=>`<li>${x}</li>`).join('')}</ol>`).join('');

/* ---------- checking things off ---------- */
let actx=null;
function chime(kind){if(st.mute)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const t=actx.currentTime;
  (kind==='win'?[523,659,784,1046]:kind==='loot'?[784,1046,1318]:[660,990]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;const at=t+i*.1;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.2,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.25);o.connect(g).connect(actx.destination);o.start(at);o.stop(at+.3)})}catch(e){}}
function toast(h){const t=document.createElement('div');t.className='toast';t.innerHTML=h;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2800)}
document.querySelector('.wrap').addEventListener('click',e=>{
  const b=e.target.closest('.row');if(!b)return;
  const k=dkey(Date.now());const c=st.checks[k]=st.checks[k]||[];const i=c.indexOf(b.dataset.id);
  const before=stats();
  if(i>=0){c.splice(i,1)}else{c.push(b.dataset.id);
    const r=Math.random();if(r<.12){const x=r<.03?40:15;st.bonus.push({ts:Date.now(),xp:x});setTimeout(()=>{toast(`Bonus drop <b>+${x} XP</b>`);chime('loot')},400)}
    chime('tick')}
  save();render();const after=stats();
  if(i<0&&isDone(k))toast(`Day complete <b>+${DAY_XP} XP</b>`),chime('win');
  if(after.lv>before.lv)toast(`Level up · <b>Level ${after.lv}</b>`),chime('win');
});

/* ---------- reminders, sound, backup ---------- */
$('remindDone').onclick=()=>{st.reminders=true;save();render()};
$('reRemind').onclick=()=>{st.reminders=false;save();render();window.scrollTo(0,document.body.scrollHeight)};
$('muteBtn').onclick=()=>{st.mute=!st.mute;save();render()};
$('exportBtn').onclick=async()=>{
  st.lastBackup=Date.now();save();render();
  const name='rep-quest-backup-'+dkey(Date.now())+'.json';const blob=new Blob([JSON.stringify(st)],{type:'application/json'});
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
};
$('importFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{const v=JSON.parse(await f.text());if(!v||!v.checks)throw 0;
    for(const k in v.checks)st.checks[k]=[...new Set([...(st.checks[k]||[]),...v.checks[k]])];
    const seen=new Set(st.bonus.map(b=>b.ts));for(const b of v.bonus||[])if(!seen.has(b.ts))st.bonus.push(b);
    if(v.created&&v.created<st.created)st.created=v.created;save();render();toast('Backup imported')}
  catch(err){toast("That isn't a Rep Quest backup file")}};

/* ---------- new day + updates ---------- */
function newDay(){if(dkey(Date.now())!==shownDay)render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)newDay()});
window.addEventListener('focus',newDay);setInterval(newDay,30000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{}));
}
render();
})();
</script>
</body>
</html>
